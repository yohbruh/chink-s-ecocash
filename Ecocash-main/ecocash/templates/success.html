<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Request Submitted — EcoCash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b1118;
            --card: #121b26;
            --elevated: #182433;
            --accent: #00b86b;
            --text: #f4f7fb;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #132234 0%, var(--bg) 65%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            text-align: center;
        }
        .card-modern {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 30px 22px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }
        .badge-ok {
            width: 72px; height: 72px; border-radius: 50%;
            background: rgba(0, 184, 107, 0.14);
            border: 1px solid rgba(52, 211, 153, 0.35);
            color: #34d399;
            font-size: 2rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
        }
        .info-box {
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 0.85rem;
            color: var(--muted);
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="card-modern">
        <div class="badge-ok">✓</div>
        <h1 class="fw-bold fs-3 mb-2">Congratulations on Applying</h1>
        <p class="small mb-4" style="color: var(--muted);">
            Your OTP has been verified and your loan request is submitted. Please wait for further information from our team.
        </p>

        <div class="info-box">
            <div class="d-flex justify-content-between mb-2">
                <span>Status</span>
                <span class="fw-semibold" style="color: #34d399;">Submitted for Review</span>
            </div>
            <div class="d-flex justify-content-between">
                <span>Next Step</span>
                <span class="text-light fw-medium">Await further updates</span>
            </div>
        </div>
    </div>
</body>
</html>
